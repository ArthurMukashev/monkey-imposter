# Продакшен-стек локального бэкенда киоска. Без pgadmin, с паролем БД.
# Запуск: docker compose -f docker-compose.kiosk.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kiosk_backend_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:?задайте APP_KEY в .env}
      - APP_URL=http://localhost:8081
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-afisha}
      - DB_USERNAME=${DB_USERNAME:-afisha}
      - DB_PASSWORD=${DB_PASSWORD:?задайте пароль в .env}
      - API_SOURCE=local
      - REMOTE_API_URL=${REMOTE_API_URL:?задайте URL VPS в .env}
    networks:
      - kiosk-network

  db:
    image: postgis/postgis:16-3.4
    container_name: kiosk_backend_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-afisha}
      POSTGRES_USER: ${DB_USERNAME:-afisha}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте пароль в .env}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-afisha} -d ${DB_DATABASE:-afisha}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kiosk-network

  webserver:
    image: nginx:alpine
    container_name: kiosk_backend_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kiosk-network

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kiosk_backend_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:?задайте APP_KEY в .env}
      - APP_URL=http://localhost:8081
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-afisha}
      - DB_USERNAME=${DB_USERNAME:-afisha}
      - DB_PASSWORD=${DB_PASSWORD:?задайте пароль в .env}
      - API_SOURCE=local
      - REMOTE_API_URL=${REMOTE_API_URL:?задайте URL VPS в .env}
    networks:
      - kiosk-network

volumes:
  postgis_data:

networks:
  kiosk-network:
    driver: bridge
